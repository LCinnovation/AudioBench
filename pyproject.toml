[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audiobench"
version = "0.5.1"
description = "AudioBench - local multi-track audio workstation (Windows x64)"
requires-python = ">=3.11"
dependencies = [
    "PySide6-Essentials==6.8.3",
    "numpy>=2.1,<3",
    "soxr>=1.1",
    "pycryptodome>=3.20",
]

[project.optional-dependencies]
sep = ["onnxruntime>=1.18"]
dev = ["pytest>=8", "pyinstaller>=6.10", "ruff>=0.9", "fonttools>=4.50"]

[project.scripts]
audiobench = "ab.app.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
